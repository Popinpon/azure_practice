[project]
name = "closed-foundry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.25.3",
    "msal>=1.39.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# 通常の実行用(run-mcp-agent.pyなど)。openai>=3.0.0が必要。
core = [
    "azure-ai-projects>=2.7.0",
    "openai>=3.19.2",
]
# litellm検証用(scripts/test_litellm_key_auth.pyなど)。litellmは全バージョンが
# openai<3.0.0を要求するためcoreと共存できない。詳細はdocs/tips/litellm.md参照。
litellm = [
    "litellm==1.104.0.dev2",
]

[tool.uv]
conflicts = [
    [
      { extra = "core" },
      { extra = "litellm" },
    ],
]
